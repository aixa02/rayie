<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayie Árabe Gourmet</title>
    <link rel="icon" type="image/svg+xml" href="recursos graficos/flaticon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="description" content="Rayie Árabe Gourmet. Cocina árabe tradicional en Puerto San Julián, Patagonia.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arena: '#C8A96E',
                        bordo: '#6B2737',
                        'arena-claro': '#F5EDD8',
                        crema: '#FAF6EE',
                        madera: '#3D2B1F',
                        'madera-claro': '#6B5645',
                        'arena-medio': '#D4B483',
                    }
                }
            }
        }
    </script>
    <script src="js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-crema text-madera overflow-x-hidden">

    <!-- NAV -->
    <nav x-data="{ open:false }" class="bg-madera sticky top-0 z-50 px-6 md:px-10 py-4">
        <div class="flex items-center justify-between">

            <!-- Logo -->
            <img src="recursos graficos/logorayie.svg" class="h-16 md:h-24 w-auto" alt="Rayie Árabe Gourmet">

            <!-- Desktop menu -->
            <ul class="hidden md:flex gap-9 list-none">
                <li>
                    <a href="carta.html"
                        class="text-arena-claro text-xs tracking-widest uppercase bg-bordo font-bold hover:text-arena transition-colors p-2 rounded-md">
                        Carta
                    </a>
                </li>
                <li>
                    <a href="index.html#nosotros"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold hover:text-arena transition-colors">
                        Nosotros
                    </a>
                </li>

                <li>
                    <a href="index.html#galeria"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold hover:text-arena transition-colors">
                        Galería
                    </a>
                </li>

                <li>
                    <a href="index.html#horarios"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold hover:text-arena transition-colors">
                        Horarios
                    </a>
                </li>

                <li>
                    <a href="index.html#contacto"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold hover:text-arena transition-colors">
                        Contacto
                    </a>
                </li>
            </ul>


            <button @click="open = !open" class="md:hidden text-arena-claro" :aria-label="open ? 'Cerrar menú' : 'Abrir menú'">
                <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg x-show="open" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

        </div>

        <!-- Mobile menu -->
        <div x-show="open" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 -translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-4" class="md:hidden mt-6 overflow-hidden">
            <ul class="flex flex-col gap-5 list-none">
                <li>
                    <a href="carta.html"
                        class="text-arena-claro text-xs tracking-widest uppercase bg-bordo font-bold hover:text-arena transition-colors p-2 rounded-md">
                        Carta
                    </a>
                </li>
                <li><a href="index.html#nosotros"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold">Nosotros</a></li>
                <li><a href="index.html#galeria"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold">Galería</a>
                </li>
                <li><a href="index.html#horarios"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold">Horarios</a></li>
                <li><a href="index.html#contacto"
                        class="text-arena-claro text-xs tracking-widest uppercase font-bold">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main class="px-6 md:px-10 py-3">
        <section id="carta" x-data="carta()" x-init="cargarCarta()" class="bg-crema py-12 px-6">

            <!-- Toggle de idioma -->
            <div class="text-center mb-6">
                <button @click="idioma = 'es'" :class="idioma === 'es' ? 'text-bordo font-bold' : 'text-madera-claro'">
                    Español
                </button>
                <span class="mx-4">|</span>
                <button @click="idioma = 'en'" :class="idioma === 'en' ? 'text-bordo font-bold' : 'text-madera-claro'">
                    English
                </button>
            </div>

            <!-- Filtros -->
            <div class="max-w-4xl mx-auto mb-10 flex flex-col items-center gap-4">
                <div class="flex flex-wrap justify-center gap-2">
                    <button @click="categoriaFiltro = 'todas'"
                        :class="categoriaFiltro === 'todas' ? 'bg-bordo text-arena-claro' : 'bg-arena-claro text-madera'"
                        class="px-4 py-1.5 text-xs uppercase tracking-widest font-bold transition-colors">
                        <span x-text="idioma === 'es' ? 'Todas' : 'All'"></span>
                    </button>
                    <template x-for="categoria in carta" :key="categoria.id">
                        <button @click="categoriaFiltro = categoria.id"
                            :class="categoriaFiltro === categoria.id ? 'bg-bordo text-arena-claro' : 'bg-arena-claro text-madera'"
                            class="px-4 py-1.5 text-xs uppercase tracking-widest font-bold transition-colors"
                            x-text="categoria.nombre[idioma]">
                        </button>
                    </template>
                </div>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="soloVeggie" class="accent-bordo w-4 h-4">
                    <span class="text-xs uppercase tracking-widest font-bold text-madera"
                        x-text="idioma === 'es' ? 'Solo vegetariano' : 'Vegetarian only'"></span>
                </label>
            </div>

            <!-- Sin resultados -->
            <template x-if="categoriasFiltradas.length === 0">
                <p class="text-center text-madera-claro"
                    x-text="idioma === 'es' ? 'No hay platos que coincidan con el filtro.' : 'No dishes match this filter.'">
                </p>
            </template>

            <!-- Categorías -->
            <template x-for="categoria in categoriasFiltradas" :key="categoria.id">
                <div class="max-w-4xl mx-auto mb-16">
                    <h2 x-text="categoria.nombre[idioma]"
                        class="text-madera mb-8 text-2xl md:text-3xl font-bold tracking-wide"
                        style="font-family: 'Playfair Display'"></h2>

                    <!-- Platos de esa categoría -->
                    <div class="grid gap-8">
                        <template x-for="plato in categoria.platos" :key="plato.id">
                            <div class="border-b border-arena/30 pb-6">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 x-text="plato.nombre[idioma]"
                                        class="text-madera text-lg font-semibold tracking-wide "></h3>

                                    <div class="text-bordo font-bold">
                                        <template x-if="typeof plato.precio === 'number'">
                                            <span x-text="'$' + plato.precio.toLocaleString('es-AR')"></span>
                                        </template>
                                        <template x-if="typeof plato.precio === 'object'">
                                            <div class="text-sm text-right">
                                                <template x-if="plato.precio.salon">
                                                    <div
                                                        x-text="'Salón: $' + plato.precio.salon.toLocaleString('es-AR')">
                                                    </div>
                                                </template>
                                                <template x-if="plato.precio.llevar">
                                                    <div
                                                        x-text="'Llevar: $' + plato.precio.llevar.toLocaleString('es-AR')">
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <p x-show="plato.descripcion" x-text="plato.descripcion?.[idioma]"
                                    class="text-madera-claro text-sm text-balance"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-madera px-10 py-8 text-center">
        <p class="text-arena-claro mb-3 lg:text-xl text-sm" style="font-family: 'Playfair Display', serif;">Rayie Árabe
            Gourmet
        </p>
        <p class="text-arena-claro lg:text-sm text-xs tracking-widest ">© 2026 · Puerto San Julián, Santa Cruz ·
            Patagonia
            Argentina</p>
    </footer>
    <!-- Botón flotante "ir arriba" -->
    <div x-data="{ visible: false }"
        x-init="window.addEventListener('scroll', () => { visible = window.scrollY > 400 })">
        <button x-show="visible" x-transition @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
            class="fixed bottom-8 right-8 z-50 w-12 h-12 bg-bordo hover:bg-madera transition-colors flex items-center justify-center"
            aria-label="Volver arriba">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--arena-claro)" stroke-width="2"
                stroke-linecap="round">
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>
    </div>
</body>

</html>
